<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard - 实时行情</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 2.5em;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        
        header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .last-update {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        
        .card.active {
            border: 2px solid #1a1a1a;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .coin-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-right: 12px;
        }
        
        .btc-icon { background: #f7931a; color: white; }
        .eth-icon { background: #627eea; color: white; }
        .sol-icon { background: #00ffa3; color: #333; }
        
        .coin-info h3 {
            font-size: 1.2em;
            font-weight: 500;
            color: #1a1a1a;
        }
        
        .coin-info span {
            font-size: 0.85em;
            color: #999;
        }
        
        .price {
            font-size: 2em;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .change {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        .change.up {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .change.down {
            background: #ffebee;
            color: #c62828;
        }
        
        .chart-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 40px;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .chart-header h2 {
            font-size: 1.3em;
            font-weight: 500;
            color: #1a1a1a;
        }
        
        .time-selector {
            display: flex;
            gap: 8px;
        }
        
        .time-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        
        .time-btn:hover {
            background: #f5f5f5;
        }
        
        .time-btn.active {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #999;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a1a1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .alert-section h2 {
            font-size: 1.3em;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        
        .alert-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        .btn-primary {
            padding: 12px 24px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-primary:hover {
            background: #333;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .alert-form {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2em;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Crypto Dashboard</h1>
            <p>实时加密货币行情监控</p>
            <div class="last-update" id="lastUpdate">正在获取数据...</div>
        </header>
        
        <div class="stats-grid" id="statsGrid">
            <div class="card active" data-coin="bitcoin" onclick="selectCoin('bitcoin', 'BTC')">
                <div class="card-header">
                    <div class="coin-icon btc-icon">₿</div>
                    <div class="coin-info">
                        <h3>Bitcoin</h3>
                        <span>BTC</span>
                    </div>
                </div>
                <div class="price" id="btcPrice">加载中...</div>
                <span class="change" id="btcChange">--</span>
            </div>
            
            <div class="card" data-coin="ethereum" onclick="selectCoin('ethereum', 'ETH')">
                <div class="card-header">
                    <div class="coin-icon eth-icon">Ξ</div>
                    <div class="coin-info">
                        <h3>Ethereum</h3>
                        <span>ETH</span>
                    </div>
                </div>
                <div class="price" id="ethPrice">加载中...</div>
                <span class="change" id="ethChange">--</span>
            </div>
            
            <div class="card" data-coin="solana" onclick="selectCoin('solana', 'SOL')">
                <div class="card-header">
                    <div class="coin-icon sol-icon">S</div>
                    <div class="coin-info">
                        <h3>Solana</h3>
                        <span>SOL</span>
                    </div>
                </div>
                <div class="price" id="solPrice">加载中...</div>
                <span class="change" id="solChange">--</span>
            </div>
        </div>
        
        <div class="chart-section">
            <div class="chart-header">
                <h2 id="chartTitle">BTC 价格走势</h2>
                <div class="time-selector">
                    <button class="time-btn" data-days="1" onclick="changeTimeRange(1)">24H</button>
                    <button class="time-btn active" data-days="7" onclick="changeTimeRange(7)">7D</button>
                    <button class="time-btn" data-days="30" onclick="changeTimeRange(30)">30D</button>
                    <button class="time-btn" data-days="365" onclick="changeTimeRange(365)">1Y</button>
                </div>
            </div>
            <div class="chart-container">
                <div class="loading" id="chartLoading">
                    <div class="spinner"></div>
                    正在加载图表数据...
                </div>
                <canvas id="priceChart" style="display: none;"></canvas>
            </div>
        </div>
        
        <div class="alert-section">
            <h2>价格提醒设置</h2>
            <form class="alert-form" onsubmit="setAlert(event)">
                <div class="form-group">
                    <label>币种</label>
                    <select id="alertCoin">
                        <option value="BTC">BTC</option>
                        <option value="ETH">ETH</option>
                        <option value="SOL">SOL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>目标价格 (USD)</label>
                    <input type="number" id="alertPrice" placeholder="输入目标价格" step="0.01">
                </div>
                <button type="submit" class="btn-primary">设置提醒</button>
            </form>
        </div>
        
        <footer>
            <p>数据来源：CoinGecko API | 实时更新</p>
        </footer>
    </div>
    
    <script>
        let currentCoin = 'bitcoin';
        let currentSymbol = 'BTC';
        let currentDays = 7;
        let chart = null;
        let priceChart = null;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            fetchPrices();
            fetchChartData(currentCoin, currentDays);
            
            // 每30秒刷新价格
            setInterval(fetchPrices, 30000);
        });
        
        // 获取实时价格
        async function fetchPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true');
                const data = await response.json();
                
                updatePriceCard('bitcoin', data.bitcoin, 'btc');
                updatePriceCard('ethereum', data.ethereum, 'eth');
                updatePriceCard('solana', data.solana, 'sol');
                
                document.getElementById('lastUpdate').textContent = '最后更新：' + new Date().toLocaleString('zh-CN');
            } catch (error) {
                console.error('获取价格失败:', error);
            }
        }
        
        // 更新价格卡片
        function updatePriceCard(coin, data, prefix) {
            const price = data.usd.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
            const change = data.usd_24h_change;
            const changePercent = change.toFixed(2) + '%';
            const changeClass = change >= 0 ? 'up' : 'down';
            const changeIcon = change >= 0 ? '↑' : '↓';
            
            document.getElementById(prefix + 'Price').textContent = price;
            const changeEl = document.getElementById(prefix + 'Change');
            changeEl.textContent = changeIcon + ' ' + changePercent;
            changeEl.className = 'change ' + changeClass;
        }
        
        // 获取图表数据（带重试机制）
        async function fetchChartData(coin, days, retryCount = 0) {
            document.getElementById('chartLoading').style.display = 'flex';
            document.getElementById('chartLoading').innerHTML = '<div class="spinner"></div>正在加载图表数据...';
            document.getElementById('priceChart').style.display = 'none';
            
            try {
                // 添加延迟避免请求过快
                if (retryCount > 0) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
                
                const response = await fetch(`https://api.coingecko.com/api/v3/coins/${coin}/market_chart?vs_currency=usd&days=${days}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 429 && retryCount < 3) {
                        // 被限流，2秒后重试
                        document.getElementById('chartLoading').innerHTML = '<div class="spinner"></div>请求过于频繁，' + (retryCount + 1) + '/3 秒后重试...';
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return fetchChartData(coin, days, retryCount + 1);
                    }
                    throw new Error('HTTP ' + response.status);
                }
                
                const data = await response.json();
                
                if (!data.prices || data.prices.length === 0) {
                    throw new Error('No data');
                }
                
                const prices = data.prices.map(p => ({
                    x: new Date(p[0]),
                    y: p[1]
                }));
                
                renderChart(prices, coin);
            } catch (error) {
                console.error('获取图表数据失败:', error);
                if (retryCount < 3) {
                    document.getElementById('chartLoading').innerHTML = '<div class="spinner"></div>加载失败，' + (retryCount + 1) + '/3 秒后重试...';
                    setTimeout(() => fetchChartData(coin, days, retryCount + 1), 2000);
                } else {
                    document.getElementById('chartLoading').innerHTML = '加载失败，请刷新页面重试<br><small>可能是 API 限流，请稍后再试</small>';
                }
            }
        }
        
        // 渲染图表
        function renderChart(prices, coin) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (priceChart) {
                priceChart.destroy();
            }
            
            const color = coin === 'bitcoin' ? '#f7931a' : coin === 'ethereum' ? '#627eea' : '#00ffa3';
            
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: currentSymbol + ' Price',
                        data: prices,
                        borderColor: color,
                        backgroundColor: color + '20',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return currentSymbol + ': $' + context.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'MM-dd',
                                    month: 'yyyy-MM'
                                }
                            },
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            },
                            grid: {
                                color: '#f0f0f0'
                            }
                        }
                    }
                }
            });
            
            document.getElementById('chartLoading').style.display = 'none';
            document.getElementById('priceChart').style.display = 'block';
        }
        
        // 选择币种
        function selectCoin(coin, symbol) {
            currentCoin = coin;
            currentSymbol = symbol;
            
            // 更新卡片样式
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`[data-coin="${coin}"]`).classList.add('active');
            
            // 更新标题
            document.getElementById('chartTitle').textContent = symbol + ' 价格走势';
            
            // 重新加载图表
            fetchChartData(coin, currentDays);
        }
        
        // 切换时间范围
        function changeTimeRange(days) {
            currentDays = days;
            
            // 更新按钮样式
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.days) === days) {
                    btn.classList.add('active');
                }
            });
            
            // 重新加载图表
            fetchChartData(currentCoin, days);
        }
        
        // 设置提醒
        function setAlert(e) {
            e.preventDefault();
            const coin = document.getElementById('alertCoin').value;
            const price = document.getElementById('alertPrice').value;
            
            if (!price) {
                alert('请输入目标价格');
                return;
            }
            
            alert(`已设置 ${coin} 价格提醒：$${price}`);
            
            // 这里可以接入后端 API 保存提醒设置
        }
    </script>
</body>
</html>
